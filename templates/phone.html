{% extends "base.html" %}
{% block content %}
<h2><i class="bi bi-telephone"></i> Пробив номера</h2>
<form method="post" class="mb-4">
    <div class="input-group">
        <input type="text" name="query" class="form-control form-control-lg" placeholder="+7 (999) 123-45-67" value="{{ query }}" required autofocus>
        <button class="btn btn-primary btn-lg" type="submit"><i class="bi bi-search"></i> Проверить</button>
    </div>
</form>
{% if result is not none %}
<div class="card">
    <div class="card-header">Результат: {{ query }}</div>
    <div class="card-body">
        {% if result is mapping %}
            <table class="table table-dark table-striped">
                {% for k, v in result.items() %}
                <tr><th>{{ k }}</th><td>{{ v }}</td></tr>
                {% endfor %}
            </table>
        {% else %}
            <pre class="mb-0">{{ result }}</pre>
        {% endif %}
    </div>
</div>
{% endif %}
{% endblock %}
