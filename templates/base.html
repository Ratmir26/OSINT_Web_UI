<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSINT Web UI{% if title %} - {{ title }}{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar d-flex flex-column flex-shrink-0 p-3">
            <a href="{{ url_for('index') }}" class="navbar-brand mb-3 text-center">
                <i class="bi bi-shield-shaded"></i> OSINT
            </a>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="{{ url_for('search') }}" class="nav-link {% if active == 'search' %}active{% endif %}">
                        <i class="bi bi-search"></i> Поиск
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('phone') }}" class="nav-link {% if active == 'phone' %}active{% endif %}">
                        <i class="bi bi-telephone"></i> Телефон
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('email') }}" class="nav-link {% if active == 'email' %}active{% endif %}">
                        <i class="bi bi-envelope"></i> Email
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('ip') }}" class="nav-link {% if active == 'ip' %}active{% endif %}">
                        <i class="bi bi-globe"></i> IP / Домен
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('name') }}" class="nav-link {% if active == 'name' %}active{% endif %}">
                        <i class="bi bi-person"></i> Имя
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('telegram') }}" class="nav-link {% if active == 'telegram' %}active{% endif %}">
                        <i class="bi bi-telegram"></i> Telegram
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li class="nav-item">
                    <a href="{{ url_for('marketplace') }}" class="nav-link {% if active == 'marketplace' %}active{% endif %}">
                        <i class="bi bi-cart"></i> Маркетплейсы
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('avito') }}" class="nav-link {% if active == 'avito' %}active{% endif %}">
                        <i class="bi bi-tag"></i> Avito / Юла
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('youtube') }}" class="nav-link {% if active == 'youtube' %}active{% endif %}">
                        <i class="bi bi-youtube"></i> YouTube
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li class="nav-item">
                    <a href="{{ url_for('compare') }}" class="nav-link {% if active == 'compare' %}active{% endif %}">
                        <i class="bi bi-columns-gap"></i> Сравнение
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('graph') }}" class="nav-link {% if active == 'graph' %}active{% endif %}">
                        <i class="bi bi-diagram-3"></i> Граф
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('history') }}" class="nav-link {% if active == 'history' %}active{% endif %}">
                        <i class="bi bi-clock-history"></i> История
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('mass') }}" class="nav-link {% if active == 'mass' %}active{% endif %}">
                        <i class="bi bi-upload"></i> Массовый
                    </a>
                </li>
            </ul>
        </nav>

        <main class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="loading-overlay">
        <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
            <span class="visually-hidden">Загрузка...</span>
        </div>
        <p class="mt-3 text-light fs-5">Выполняется поиск...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
