{% extends "base.html" %}
{% block content %}
<h2><i class="bi bi-columns-gap"></i> Сравнение компаний</h2>
<form method="post" class="mb-4">
    <div class="row g-2">
        <div class="col-md-5">
            <input type="text" name="query1" class="form-control form-control-lg" placeholder="Первая компания" value="{{ query1 }}" required>
        </div>
        <div class="col-md-2 text-center d-flex align-items-center justify-content-center">
            <span class="fs-4">VS</span>
        </div>
        <div class="col-md-5">
            <input type="text" name="query2" class="form-control form-control-lg" placeholder="Вторая компания" value="{{ query2 }}" required>
        </div>
    </div>
    <button class="btn btn-primary btn-lg mt-3 w-100" type="submit"><i class="bi bi-search"></i> Сравнить</button>
</form>
{% if result is not none %}
<div class="card">
    <div class="card-header">Сравнение: {{ query1 }} VS {{ query2 }}</div>
    <div class="card-body">
        {% if result is mapping %}
            <table class="table table-dark table-striped">
                {% for k, v in result.items() %}
                <tr><th>{{ k }}</th><td>{{ v }}</td></tr>
                {% endfor %}
            </table>
        {% else %}
            <pre class="mb-0">{{ result }}</pre>
        {% endif %}
    </div>
</div>
{% endif %}
{% endblock %}
