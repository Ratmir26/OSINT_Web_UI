{% extends "base.html" %}
{% block content %}
<h2><i class="bi bi-search"></i> OSINT Поиск</h2>
<form method="post" class="mb-4">
    <div class="input-group">
        <input type="text" name="query" class="form-control form-control-lg" placeholder="Компания, ИП, адрес..." value="{{ query }}" required autofocus>
        <button class="btn btn-primary btn-lg" type="submit"><i class="bi bi-search"></i> Поиск</button>
    </div>
</form>
{% if result is not none %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>Результат: {{ query }}</span>
        <form method="post" action="{{ url_for('export_pdf') }}" class="d-inline">
            <input type="hidden" name="query" value="{{ query }}">
            <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-filetype-pdf"></i> PDF</button>
        </form>
        <form method="post" action="{{ url_for('export_excel') }}" class="d-inline">
            <input type="hidden" name="query" value="{{ query }}">
            <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-file-earmark-excel"></i> Excel</button>
        </form>
    </div>
    <div class="card-body"><pre class="mb-0" style="white-space: pre-wrap;">{{ result }}</pre></div>
</div>
{% endif %}
{% endblock %}
