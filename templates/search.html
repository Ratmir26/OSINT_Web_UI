{% extends "base.html" %}
{% block content %}
<h2><i class="bi bi-search"></i> OSINT Поиск</h2>
<form id="search-form" method="post" class="mb-4" onsubmit="return wsSearch(event)">
    <div class="input-group">
        <input type="text" id="search-query" name="query" class="form-control form-control-lg" placeholder="Компания, ИП, адрес..." value="{{ query }}" required autofocus>
        <button id="search-btn" class="btn btn-primary btn-lg" type="submit"><i class="bi bi-search"></i> Поиск</button>
    </div>
</form>

<div id="progress-log" class="mb-3" style="display:none;">
    <div class="card">
        <div class="card-header"><i class="bi bi-arrow-repeat"></i> Выполняется поиск...</div>
        <div class="card-body" id="progress-messages" style="max-height:250px;overflow-y:auto;font-family:monospace;font-size:0.85rem;"></div>
    </div>
</div>

<div id="result-area">
{% if result is not none %}
<div class="card result-card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-file-text"></i> Результат: {{ query }}</span>
        <div>
            <form method="post" action="{{ url_for('export_pdf') }}" class="d-inline">
                <input type="hidden" name="query" value="{{ query }}">
                <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-filetype-pdf"></i> PDF</button>
            </form>
            <form method="post" action="{{ url_for('export_excel') }}" class="d-inline">
                <input type="hidden" name="query" value="{{ query }}">
                <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-file-earmark-excel"></i> Excel</button>
            </form>
        </div>
    </div>
    <div class="card-body">
        {% if result_html %}
            {{ result_html | safe }}
        {% else %}
            <pre class="mb-0" style="white-space: pre-wrap;">{{ result }}</pre>
        {% endif %}
    </div>
</div>
{% endif %}
</div>
{% endblock %}
