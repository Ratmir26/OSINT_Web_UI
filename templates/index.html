{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-shield-shaded"></i> OSINT Web UI</h1>
    </div>
    <p class="text-muted mb-4">Выберите модуль для поиска информации:</p>
    <div class="row g-4">
        {% for route, name, desc in modules %}
        <div class="col-md-6 col-lg-4 col-xl-3">
            <a href="{{ url_for(route) }}" class="text-decoration-none">
                <div class="card h-100 module-card">
                    <div class="card-body">
                        <h5 class="card-title">{{ name }}</h5>
                        <p class="card-text text-muted small">{{ desc }}</p>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
